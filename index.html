<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Liquor Oz">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Liquor Ounce Tracker</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#000;--sub:#6e6e73;--sep:#d1d1d6;--blue:#007aff;--red:#ff3b30;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--tx:#fff;--sub:#98989f;--sep:#38383a;--blue:#0a84ff;--red:#ff453a}}
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:17px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%;
padding:env(safe-area-inset-top) calc(16px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
h1{font-size:34px;font-weight:700;margin:16px 4px 12px}h2{font-size:13px;font-weight:400;text-transform:uppercase;color:var(--sub);margin:22px 16px 6px}
.card{background:var(--card);border-radius:10px;overflow:hidden}.row{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-bottom:.5px solid var(--sep)}.row:last-child{border-bottom:0}
input,select{flex:1;border:0;background:none;color:var(--tx);font:inherit;padding:11px 0;outline:none;min-width:0}select{text-align:right;color:var(--blue);-webkit-appearance:none;appearance:none}
.muted{color:var(--sub)}.sp{flex:1}.big{font-size:20px;font-weight:700;color:var(--blue)}
button#save{width:100%;border:0;background:none;color:var(--blue);font:inherit;padding:12px;cursor:pointer}button#save:disabled{color:var(--sub);opacity:.6}
ul{list-style:none;margin:0;padding:0}li{display:flex;align-items:center;gap:10px;padding:10px 8px 10px 16px;border-bottom:.5px solid var(--sep)}li:last-child{border-bottom:0}
.info{flex:1;min-width:0}.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis}.sub{font-size:12px;color:var(--sub)}.pp{font-weight:700}
.del{border:0;background:var(--red);color:#fff;border-radius:50%;width:28px;height:28px;font-size:13px}.empty{color:var(--sub);font-style:italic}
.seg{display:flex;background:rgba(118,118,128,.12);border-radius:9px;padding:2px;margin:0 0 8px}.seg button{flex:1;border:0;background:none;color:var(--tx);font:500 13px -apple-system,system-ui,sans-serif;padding:6px 4px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}.seg i{font-style:normal;font-size:9px;margin-left:4px;color:var(--blue)}
@media(prefers-color-scheme:dark){.seg{background:rgba(118,118,128,.24)}.seg button.on{background:#636366}.seg i{color:#fff}}
</style></head><body>
<h1>Liquor Ounce Tracker</h1>
<h2>Liquor Details</h2><div class="card">
<div class="row"><input id="name" placeholder="Item Name (e.g., Jameson)" autocomplete="off"></div>
<div class="row"><span>$</span><input id="price" inputmode="decimal" placeholder="Total Price"></div></div>
<h2>Bottle Size</h2><div class="card">
<div class="row"><span>Size Preset</span><select id="size"><option value="50">50 ml (Nip)</option><option value="375">375 ml (Half)</option><option value="750" selected>750 ml (Fifth)</option><option value="1000">1.0 L (Quart)</option><option value="1750">1.75 L (Handle)</option><option value="0">Custom (ml)</option></select></div>
<div class="row" id="customRow" hidden><input id="custom" inputmode="numeric" placeholder="Enter custom ml"><span>ml</span></div>
<div class="row" id="volRow"><span>Total Volume:</span><span class="sp"></span><span id="vol" class="muted"></span></div></div>
<h2>&nbsp;</h2><div class="card">
<div class="row"><b>Cost Per Ounce:</b><span class="sp"></span><span id="ppo" class="big">$0.00 / oz</span></div>
<div class="row"><button id="save" disabled>⊕ Save to Price Log</button></div></div>
<h2>Saved Price Log</h2><div class="seg" id="sort" role="group" aria-label="Sort log"><button data-k="name">Name<i></i></button><button data-k="size">Size<i></i></button><button data-k="ppo">$/oz<i></i></button></div><div class="card"><ul id="log"></ul></div>
<script src="logic.js"></script><script src="app.js"></script></body></html>
